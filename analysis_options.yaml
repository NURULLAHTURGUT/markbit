# Static analysis settings, used by `flutter analyze` and Dart-enabled IDEs.
# See https://dart.dev/tools/analysis for all options.

# Recommended lints for Flutter apps.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated and platform code is not ours to lint.
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
