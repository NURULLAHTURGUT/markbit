name: markbit
description: "Markdown notes that run code: an offline-first notebook for developers."
homepage: https://github.com/NURULLAHTURGUT/markbit
repository: https://github.com/NURULLAHTURGUT/markbit
issue_tracker: https://github.com/NURULLAHTURGUT/markbit/issues
# An app, not a library: never publish to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: 4.0.9
  characters: ^1.4.0
  crypto: 3.0.6
  cryptography: ^2.9.0
  desktop_drop: 0.8.4
  ffi: ^2.1.4
  file_picker: ^11.0.3
  flutter_local_notifications: ^20.1.0
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: 10.0.0
  http: ^1.6.0
  intl: ^0.20.2
  markdown: ^7.3.1
  pasteboard: 0.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  scroll_to_index: 3.0.1
  shared_preferences: ^2.5.5
  sqlite3: 2.9.4
  # Bundles the native SQLite library used by `sqlite3` (no Dart import).
  sqlite3_flutter_libs: 0.5.42
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/markbit.png
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
