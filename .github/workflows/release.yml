name: Release Markbit
# Push a version tag to publish a release for Windows, macOS and Linux:
#   git tag v1.0.1 && git push origin v1.0.1
# Running it by hand (Actions -> Release Markbit -> Run workflow) builds all
# packages as downloadable artifacts without publishing anything.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$version' must look like 1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build windows --release --no-pub --build-name=$env:VERSION --build-number=${{ github.run_number }}

      - name: Package portable zip
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/Markbit-$env:VERSION-x64-portable.zip"

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found' }
          & $iscc "/DAppVersion=$env:VERSION" installer/markbit.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Copy-Item installer/Output/*.exe dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Markbit-${{ env.VERSION }}-windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --no-pub --build-name=$VERSION --build-number=${{ github.run_number }}
      - name: Package the app
        run: |
          mkdir -p dist "Markbit-$VERSION"
          cp -r build/linux/x64/release/bundle/. "Markbit-$VERSION/"
          tar -czf "dist/Markbit-$VERSION-linux-x64.tar.gz" "Markbit-$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Markbit-${{ env.VERSION }}-linux
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --no-pub --build-name=$VERSION --build-number=${{ github.run_number }}
      - name: Package the app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Markbit.app "dist/Markbit-$VERSION-macos.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Markbit-${{ env.VERSION }}-macos
          path: dist/*

  publish:
    # Publishes one release with the files of every platform.
    if: github.ref_type == 'tag'
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Markbit $VERSION" \
            --generate-notes
