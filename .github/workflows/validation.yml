name: Validate Markbit
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    # windows-latest ships Visual Studio 2026, which Flutter 3.35 cannot use
    # yet (flutter/flutter#180481). windows-2022 has Visual Studio 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build windows --release
