name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! Please search [existing issues](https://github.com/NURULLAHTURGUT/markbit/issues) first.
        **Security problems:** do not report them here — see [SECURITY.md](https://github.com/NURULLAHTURGUT/markbit/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem. Screenshots or a short recording help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a note with a Python code block
        2. Press Ctrl+Enter
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Markbit version
      description: Shown on the Releases page you downloaded from, for example 1.0.0.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Markbit?
      options:
        - Windows installer (Markbit-Setup)
        - Windows portable zip
        - macOS app
        - Linux tar.gz
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, macOS 15.5, Ubuntu 24.04…"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Language and theme in use, a sample note (without private content), error messages, related settings…
