# Weekly update pull requests for Dart/Flutter packages and GitHub Actions.
# Security fixes are opened as soon as an advisory is published, separately.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive together in one pull request.
      packages:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
    # Major versions can change APIs, so they are upgraded by hand, with
    # testing. Dependabot security alerts still report every vulnerability.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Breaking releases that the rule above misses (Dart `^` constraints and
      # 0.x versions). Each needs its own migration and a manual app test.
      - dependency-name: "sqlite3_flutter_libs"
        versions: [">=0.6.0"] # empty since sqlite3 3.x; would drop SQLite
      - dependency-name: "flutter_local_notifications"
        versions: [">=21.0.0"]
      - dependency-name: "xml"
        versions: [">=7.0.0"]
      - dependency-name: "timezone"
        versions: [">=0.11.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
