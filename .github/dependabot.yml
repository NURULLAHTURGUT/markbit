# Weekly update pull requests for Dart/Flutter packages and GitHub Actions.
# Security fixes are opened as soon as an advisory is published, separately.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive together in one pull request.
      packages:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
    # Major versions can change APIs, so they are upgraded by hand, with
    # testing. Dependabot security alerts still report every vulnerability.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.6 is an empty release for sqlite3 3.x: with sqlite3 2.x it would
      # drop the bundled SQLite. Remove this when migrating to sqlite3 3.x.
      - dependency-name: "sqlite3_flutter_libs"
        versions: [">=0.6.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
